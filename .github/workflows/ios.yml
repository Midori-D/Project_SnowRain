name: Build private iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test scene program and archive reader
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 Tests/make_story_fixtures.py "$RUNNER_TEMP/story-fixtures"
          swiftc Sources/Story*.swift Tests/StoryPackageSmoke.swift -o "$RUNNER_TEMP/story-smoke"
          "$RUNNER_TEMP/story-smoke" "$RUNNER_TEMP/story-fixtures"
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build device application
        run: |
          set -euo pipefail
          xcodebuild -project SnowRainNative.xcodeproj -scheme SnowRainNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for SideStore
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/SnowRainNative.app package/Payload/
          test -x package/Payload/SnowRainNative.app/SnowRainNative
          lipo package/Payload/SnowRainNative.app/SnowRainNative -verify_arch arm64
          test ! -e package/Payload/SnowRainNative.app/opening.json
          cd package
          /usr/bin/zip -qry SnowRainNative-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SnowRainNative-unsigned
          path: package/SnowRainNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
